# Canonical host for TechDossier is the non-www apex: https://techdossier.org
#
# Add these server blocks next to the existing site config. Do not replace the
# block that proxies https://techdossier.org to the Next.js app.
#
# Before reloading:
# 1. If the existing app server lists `www.techdossier.org` in server_name,
#    remove www from that block so only these blocks answer for www.
# 2. The certificate must cover www.techdossier.org. If it does not:
#      sudo certbot certonly --nginx -d techdossier.org -d www.techdossier.org
#    Then point ssl_certificate paths below at that certificate
#    (the paths shown match a typical Certbot layout; keep whatever the
#    apex server already uses if it differs).
# 3. Test and reload:
#      sudo nginx -t && sudo systemctl reload nginx

# HTTP for both names goes straight to the https apex.
# If port 80 for techdossier.org is already handled elsewhere, drop
# techdossier.org from this server_name and keep only www.techdossier.org.
server {
    listen 80;
    listen [::]:80;
    server_name techdossier.org www.techdossier.org;
    return 301 https://techdossier.org$request_uri;
}

# HTTPS www is a duplicate of the apex. Fold every path into the apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.techdossier.org;

    ssl_certificate     /etc/letsencrypt/live/techdossier.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techdossier.org/privkey.pem;

    return 301 https://techdossier.org$request_uri;
}
